name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: demo
      DBT_DUCKDB_PATH: ci_pipeline.duckdb
      OBT_TABLE_NAME: obt_nyc_taxi__trips
      TAXI_DATA_RAW_PATH: taxi_transforms/tests/fixtures/raw_data
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Install dbt dependencies
        run: make db_deps

      - name: Build and test dbt
        run: make db_build

      - name: Run Tests with Coverage
        run: uv run pytest --ignore=taxi_transforms --cov=src/nyc_taxi_data --cov-report=term-missing
