version: 2

seeds:
  - name: payment_type_lookup
    description: All payment info provided by NYC TLC.
    columns:
      - name: payment_type_id
        description: '{{ doc("payment_type_id") }}'
        data_tests:
          - unique
          - not_null
      - name: payment_type_name
        description: '{{ doc("payment_type_name") }}'
        data_tests:
          - unique
          - not_null          
  - name: trip_type_lookup
    description: Type of trip; green only.
    columns:
      - name: trip_type_id
        description: '{{ doc("trip_type_id") }}'
        data_tests:
          - unique
          - not_null
      - name: trip_type_name
        description: '{{ doc("trip_type_name") }}'
        data_tests:
          - unique
          - not_null          
  - name: rate_code_lookup
    description: All rate code info provided by NYC TLC.
    columns:
      - name: rate_code_id
        description: '{{ doc("rate_code_id") }}'
        data_tests:
          - unique
          - not_null
      - name: rate_code_name
        description: '{{ doc("rate_code_name") }}'
        data_tests:
          - unique
          - not_null          
  - name: vendor_lookup
    description: All TPEP provider info provided by NYC TLC.
    columns:
      - name: vendor_id
        description: '{{ doc("vendor_id") }}'
        data_tests:
          - unique
          - not_null    
      - name: vendor_name
        description: '{{ doc("vendor_name") }}'
        data_tests:
          - unique
          - not_null   
  - name: taxi_zone_lookup
    description: All location info provided by NYC TLC.
    columns:
      - name: location_id
        description: '{{ doc("location_id") }}'
        data_tests:
          - unique
          - not_null                   
      - name: borough_name
        description: '{{ doc("borough_name") }}'
        data_tests:
          - not_null
      - name: zone_name
        description: '{{ doc("zone_name") }}'
        data_tests:
          - not_null
      - name: service_zone
        description: '{{ doc("service_zone") }}'
        data_tests:
          - not_null                     
